# CI for the Pyro workspace (project plan §13, Q33).
# Signed macOS releases live in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flutter stable only (Q18). Bump together with the local toolchain and
  # update-goldens.yml (then refresh the goldens with it); Flutter
  # 3.44.x caps build_runner at 2.15.1 (Q76), which matters once the contract
  # job runs the generator.
  FLUTTER_VERSION: "3.44.2"
# Linux jobs pin ubuntu-24.04 rather than ubuntu-latest, which moves to
# Ubuntu 26 from 2026-10-19 (the desktop build's apt packages, e.g.
# libstdc++-12-dev, are named per release). macOS jobs pin macos-26 rather
# than macos-latest: the pyro_ui goldens are rendered on it, and fonts
# rasterise differently between macOS releases. Move deliberately, together
# with update-goldens.yml, and refresh the goldens with it in the same change.

jobs:
  analyze-test:
    name: Analyze and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve the workspace
        run: dart pub get
      # The app's generated freezed files are committed; regenerating them
      # must change nothing (spec 002).
      - name: Check generated code
        if: runner.os == 'Linux'
        working-directory: apps/pyro
        run: dart run build_runner build -d && git diff --exit-code -- lib
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed packages apps
      - name: Analyze pure-Dart packages
        run: dart analyze --fatal-infos packages/pyro_annotations packages/pyro_generator
      - name: Analyze Flutter packages and the app
        run: flutter analyze --fatal-infos packages/pyro_runtime packages/pyro_ui apps/pyro
      - name: Test pyro_annotations
        working-directory: packages/pyro_annotations
        run: dart test
      - name: Test pyro_generator
        working-directory: packages/pyro_generator
        run: dart test
      - name: Test pyro_runtime
        working-directory: packages/pyro_runtime
        run: flutter test
      - name: Test pyro_ui
        working-directory: packages/pyro_ui
        run: flutter test
      # The gallery's smoke test everywhere; its goldens (tag `golden`) skip
      # themselves off macOS, where fonts rasterise differently (Q84).
      - name: Test the pyro_ui gallery
        working-directory: packages/pyro_ui/example
        run: flutter test
      # A failed golden writes its master, test and diff images to
      # test/failures/; keep them so the change can be seen without a rerun.
      - name: Upload golden failures
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: packages/pyro_ui/example/test/failures/
          if-no-files-found: ignore
      - name: Test the Pyro app
        working-directory: apps/pyro
        run: flutter test

  build-studio:
    name: Build Pyro (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve the workspace
        run: dart pub get
      - name: Build (unsigned release)
        working-directory: apps/pyro
        run: flutter build ${{ matrix.platform }} --release

  contract:
    # TODO(v0.1 #12, Q59): the contract test. Once example/ and the generator
    # exist:
    #   1. dart pub get, then run the generator on example/
    #      (dart run build_runner build in example/).
    #   2. Check the committed Registry and Manifest (§7.3, Q76). On Flutter
    #      3.44 (build_runner <= 2.15.1) that is
    #        git diff --exit-code lib/pyro.g.dart lib/pyro.manifest.json
    #      and on Flutter >= 3.47
    #        dart run build_runner build --only-check
    #   3. Check the Manifest against its golden file.
    #   4. Load every example/ scene with flame_test against the generated
    #      Registry.
    name: Contract test (TODO)
    runs-on: ubuntu-24.04
    steps:
      - name: Placeholder
        run: |
          echo "::notice title=Contract test::TODO(v0.1 #12) - not implemented yet; example/ and the generator don't exist."
