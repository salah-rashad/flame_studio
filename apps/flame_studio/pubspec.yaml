name: flame_studio
description: "Flame Studio: a scene editor for the Flame game engine."
# The desktop app ships as binaries from GitHub Releases, never on pub.dev.
publish_to: none
version: 0.0.1+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

# Never depends on flame_studio_generator (project plan §5). Riverpod, freezed
# and flame_tiled join when the first code uses them (v0.1 work items 0-2).
dependencies:
  flame: ">=1.36.0 <2.0.0"
  flame_studio_runtime: ^0.0.1
  flame_studio_ui: ^0.0.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
