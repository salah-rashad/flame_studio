include:
  - ../../analysis_options.yaml
  - package:flutter_lints/flutter.yaml

analyzer:
  # Flutter >= 3.47 adds these on every flutter command if they are missing
  # (flutter_tools AnalysisOptionsMigration); the root file's excludes still
  # apply, since lists merge with the included file.
  exclude:
    - build/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # The app is not a library; its classes don't need public API docs.
    public_member_api_docs: false
