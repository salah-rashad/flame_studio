name: flame_studio_runtime
description: >-
  Loads Flame Studio scenes into a Flame game. Ships in your game and
  re-exports flame_studio_annotations.
version: 0.0.1
publish_to: none # Until the package names are cleared with the Flame maintainers (Q36).
issue_tracker: https://github.com/salah-rashad/flame_studio/issues
repository: https://github.com/salah-rashad/flame_studio/tree/main/packages/flame_studio_runtime

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  # Floor 1.36 for onHotReload (Q66); latest stable minor until Flame 2.0,
  # which the Runtime moves to in one release (Q18, Q80).
  flame: ">=1.36.0 <2.0.0"
  flame_behaviors: ^1.4.0
  flame_studio_annotations: ^0.0.1
  flutter:
    sdk: flutter

dev_dependencies:
  flame_test: ^2.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
