name: flame_studio_ui
description: >-
  The Flame Studio design system in Flutter: tokens, theme and the editor's
  widgets. Used only by the Studio app.
version: 0.0.1
# Never published: it exists to keep the Studio's look apart from its state
# and logic (Q83), not to be reused.
publish_to: none
issue_tracker: https://github.com/salah-rashad/flame_studio/issues
repository: https://github.com/salah-rashad/flame_studio/tree/main/packages/flame_studio_ui

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

# Flutter only (Q83): no flame, no Runtime, no Riverpod, nothing from the app.
# The icon set and the bundled fonts join when the first widgets need them.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
