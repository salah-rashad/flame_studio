name: pyro_generator
description: >-
  build_runner generator for Pyro: writes the runtime Registry and the
  types Manifest for your game's annotated components and behaviors.
version: 0.0.1
publish_to: none # Until the package names are cleared with the Flame maintainers (Q36).
issue_tracker: https://github.com/salah-rashad/pyro/issues
repository: https://github.com/salah-rashad/pyro/tree/main/packages/pyro_generator

environment:
  sdk: ^3.12.0

resolution: workspace

# Wide ranges on purpose (ARCHITECTURE.md, spike #2 finding 1): Flutter 3.44
# pins meta so that build_runner resolves to at most 2.15.1 (analyzer 13.0,
# build 4.0, source_gen 4.2) in a user's project, while pure-Dart projects get
# the newest. Narrowing these makes the generator unresolvable for some users.
dependencies:
  analyzer: ">=12.0.0 <15.0.0"
  build: ">=4.0.0 <6.0.0"
  dart_style: ">=3.0.0 <4.0.0"
  pyro_annotations: ^0.0.1
  source_gen: ">=4.0.0 <5.0.0"

# Never depends on pyro_runtime or Flutter (Q44).

dev_dependencies:
  test: ^1.25.0
